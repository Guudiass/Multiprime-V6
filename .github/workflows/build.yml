name: Build and Release

# Codigo-fonte vive no repo PRIVADO Guudiass/Multiprime-V6-src.
# Este workflow roda no repo PUBLICO (onde estao os secrets), faz checkout do privado,
# builda e publica as releases AQUI (publish do package.json -> Guudiass/Multiprime-V6).
# Disparo MANUAL: aba Actions -> "Build and Release" -> Run workflow.
#
# >>> CORRECAO IMPORTANTE <<<
# Como o checkout agora eh do repo PRIVADO (-src), o `gh` CLI infere o repo ERRADO
# (o -src, que NAO tem releases). Por isso TODO `gh release ...` precisa de
# --repo "${{ github.repository }}" (= este repo publico, onde a release existe).
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-win-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (codigo privado Multiprime-V6-src)
        uses: actions/checkout@v4
        with:
          repository: Guudiass/Multiprime-V6-src
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2-dev rpm dpkg fakeroot imagemagick

      - name: Convert icon for Linux
        if: matrix.platform == 'linux'
        run: |
          if [ ! -f icon.png ] && [ -f icon.ico ]; then
            convert icon.ico[0] -resize 1024x1024 icon.png || true
          fi

      - name: Install dependencies
        run: npm install

      - name: Build and Publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish always

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (codigo privado Multiprime-V6-src)
        uses: actions/checkout@v4
        with:
          repository: Guudiass/Multiprime-V6-src
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Convert icon
        run: |
          if [ ! -f icon.png ] && [ -f icon.ico ]; then
            sips -s format png icon.ico --out icon.png --resampleWidth 1024 2>/dev/null || true
          fi

      - name: Install dependencies
        run: npm install

      - name: Build Mac (signed)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --mac --publish always

      # Submete os DMGs ao notarytool = REGISTRA na Apple (notarizacao "online": o Gatekeeper
      # reconhece via internet). NAO fazemos staple + re-upload do DMG moderno DE PROPOSITO:
      # o staple mudaria o sha512 do DMG, e o latest-mac.yml (gerado ANTES, pelo electron-builder)
      # ficaria invalido -> quebraria o auto-update do app. O DMG que o electron-builder ja
      # publicou eh EXATAMENTE o que foi submetido -> fica notarizado E consistente com o yml.
      # (Se um dia quiser staple no DMG moderno, o jeito certo eh notarizacao NATIVA do
      #  electron-builder, que staplea o .app ANTES de gerar o yml.)
      - name: Notarize DMGs (registro online na Apple)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "=== DMGs encontrados ==="
          ls -la dist/*.dmg 2>/dev/null || true
          for DMG in dist/*.dmg; do
            if [ -f "$DMG" ]; then
              echo "=== Notarizando (registro): $DMG ==="
              xcrun notarytool submit "$DMG" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait --timeout 30m
            fi
          done

  # Build Mac Legacy (macOS 11 Big Sur / Monterey) — Electron 22, DMG assinado + notarizado + STAPLED.
  # Os DMGs legacy NAO entram no latest-mac.yml (sao downloads avulsos do site), entao
  # podem ser stapled sem quebrar nada.
  build-mac-legacy:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (codigo privado Multiprime-V6-src)
        uses: actions/checkout@v4
        with:
          repository: Guudiass/Multiprime-V6-src
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Convert icon
        run: |
          if [ ! -f icon.png ] && [ -f icon.ico ]; then
            sips -s format png icon.ico --out icon.png --resampleWidth 1024 2>/dev/null || true
          fi

      - name: Install Electron 22 LTS (macOS 10.13+ compat)
        run: |
          npm install
          npm install electron@22 --save-dev --force

      - name: Build Mac Legacy (signed DMG, x64 + arm64)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --mac dmg --x64 --publish never
          npx electron-builder --mac dmg --arm64 --publish never

      - name: Notarize legacy DMGs
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for DMG in dist/*.dmg; do
            if [ -f "$DMG" ]; then
              echo "=== Notarizando: $DMG ==="
              xcrun notarytool submit "$DMG" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait --timeout 30m
              echo "Stapling..."
              xcrun stapler staple "$DMG"
            fi
          done

      # CORRIGIDO: --repo aponta pro repo PUBLICO (senao o gh tenta no -src privado e falha).
      # Removido o "2>/dev/null || true" + o echo "✅" mentiroso: agora, se o upload falhar,
      # o job fica VERMELHO (visivel) em vez de fingir sucesso.
      - name: Upload legacy DMGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=v$(node -p "require('./package.json').version")

          # Espera a release existir (criada por outro job via --publish always) — evita race.
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG encontrada."; break
            fi
            echo "Aguardando release $TAG existir... ($i/30)"; sleep 10
          done

          echo "=== Upload legacy DMGs para $TAG (repo ${{ github.repository }}) ==="
          for DMG in dist/*.dmg; do
            if [ -f "$DMG" ]; then
              BASENAME=$(basename "$DMG" .dmg)
              if echo "$BASENAME" | grep -q "arm64"; then
                NEWNAME="MultiPrime-V6-${TAG}-legacy-macOS11-AppleSilicon.dmg"
              else
                NEWNAME="MultiPrime-V6-${TAG}-legacy-macOS11-Intel.dmg"
              fi
              cp "$DMG" "dist/$NEWNAME"
              echo "Uploading: $NEWNAME"
              gh release upload "$TAG" "dist/$NEWNAME" --repo "${{ github.repository }}" --clobber
              echo "OK enviado: $NEWNAME"
            fi
          done
